name: Build and deploy Authentication API to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'Authentication/**'
      - '.github/workflows/main_insurance-pas-auth-api.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'Authentication/Authentication.Api/Authentication.Api.csproj'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build Authentication API
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish Authentication API
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build -o "${{ github.workspace }}/publish"

      - name: Upload published files
        uses: actions/upload-artifact@v4
        with:
          name: authentication-api
          path: publish/

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download published files
        uses: actions/download-artifact@v4
        with:
          name: authentication-api
          path: publish/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: insurance-pas-auth-api
          package: publish/
